[project]
name = "face-cloak"
version = "0.1.0"
description = "Adversarial image cloaking to protect face photos against identity face-swap attacks"
authors = [{ name = "J4KE-B", email = "jacobantonynedu@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio>=6.30.0",
    "huggingface-hub>=2.2.0",
    "insightface==0.7.3",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnx2torch>=1.5.15",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facecloak"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
extend-exclude = ["facecloak/third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights or is slow on CPU"]
timeout = 300
